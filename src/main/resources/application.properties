spring.application.name=inventario-tambo
server.port=8080
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/tambo_inventario?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Lima}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=654321
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.thymeleaf.cache=false
server.error.include-message=never
logging.level.pe.tambo=INFO
logging.file.name=logs/tambo-inventario.log
