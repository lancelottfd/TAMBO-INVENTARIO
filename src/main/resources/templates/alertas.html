<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Alertas | Tambo Inventario</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body>
<div th:replace="~{fragments :: nav}"></div><main class="container"><div class="page-heading"><div><p class="eyebrow">REPOSICIÓN</p><h1>Alertas de stock</h1><p class="muted">Productos con stock igual o inferior al mínimo definido.</p></div></div><section class="panel"><div class="table-wrap"><table><thead><tr><th>Código</th><th>Producto</th><th>Categoría</th><th>Stock actual</th><th>Stock mínimo</th><th>Estado</th></tr></thead><tbody><tr th:each="p : ${productos}"><td th:text="${p.codigo}"></td><td th:text="${p.nombre}"></td><td th:text="${p.categoria.nombre}"></td><td th:text="${p.stock}"></td><td th:text="${p.stockMinimo}"></td><td><span class="tag tag-yellow" th:text="${p.stock == 0} ? 'AGOTADO' : 'STOCK BAJO'"></span></td></tr><tr th:if="${#lists.isEmpty(productos)}"><td colspan="6" class="empty">No hay alertas. Todos los productos están por encima del mínimo.</td></tr></tbody></table></div></section></main></body></html>
