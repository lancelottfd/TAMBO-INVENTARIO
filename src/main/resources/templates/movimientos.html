<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Movimientos | Tambo Inventario</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body>
<div th:replace="~{fragments :: nav}"></div><main class="container"><div class="page-heading"><div><p class="eyebrow">TRAZABILIDAD</p><h1>Movimientos de inventario</h1><p class="muted">Cada entrada o salida actualiza el stock y queda registrada.</p></div></div>
<div class="alert success" th:if="${param.registrado}">Movimiento registrado y stock actualizado.</div><div class="alert error" th:if="${error}" th:text="${error}"></div>
<section class="panel"><h2>Registrar movimiento</h2><form class="form-grid" th:action="@{/movimientos}" method="post"><div class="wide"><label>Producto</label><select name="productoId" required><option value="">Seleccionar producto</option><option th:each="p : ${productos}" th:value="${p.id}" th:text="${p.codigo + ' — ' + p.nombre + ' (stock: ' + p.stock + ')'}"></option></select></div><div><label>Tipo</label><select name="tipo" required><option value="ENTRADA">Entrada</option><option value="SALIDA">Salida</option></select></div><div><label>Cantidad</label><input name="cantidad" type="number" min="1" required></div><div class="wide"><label>Motivo</label><input name="motivo" maxlength="200" placeholder="Reposición, merma, ajuste..."></div><div class="wide"><button class="primary" type="submit">Registrar movimiento</button></div></form></section>
<section class="panel"><h2>Historial reciente</h2><div class="table-wrap"><table><thead><tr><th>Fecha</th><th>Producto</th><th>Tipo</th><th>Cantidad</th><th>Motivo</th><th>Usuario</th></tr></thead><tbody><tr th:each="m : ${movimientos}"><td th:text="${#temporals.format(m.fecha,'dd/MM/yyyy HH:mm')}"></td><td th:text="${m.producto.nombre}"></td><td><span class="tag" th:text="${m.tipo}" th:classappend="${m.tipo == 'ENTRADA'} ? ' tag-green' : ' tag-red'"></span></td><td th:text="${m.cantidad}"></td><td th:text="${m.motivo}"></td><td th:text="${m.usuario}"></td></tr><tr th:if="${#lists.isEmpty(movimientos)}"><td colspan="6" class="empty">No hay movimientos registrados.</td></tr></tbody></table></div></section></main></body></html>
